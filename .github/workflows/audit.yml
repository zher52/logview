name: Security Audit

on:
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC
  push:
    paths: [Cargo.toml, Cargo.lock]
  pull_request:
    paths: [Cargo.toml, Cargo.lock]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}