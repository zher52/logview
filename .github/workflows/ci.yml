name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS 是当前主要开发与验证平台，作为阻塞项
  test-macos:
    name: fmt / build / test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: 构建
        run: cargo build --locked

      - name: 单元测试
        run: cargo test --locked

      # gpui-pre 在 clippy 1.100 下会误报 E0658（std 特性判定不一致），
      # 先只观察告警，不阻塞合并；清理完存量告警后改为 -D warnings。
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --all-targets --locked

  licenses:
    name: 依赖许可与来源检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses bans sources

  # Windows / Linux 尚未在本机验证，先只做构建检查，失败不阻塞
  build-other:
    name: build (${{ matrix.os }}, 实验性)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev libdbus-1-dev

      - name: 构建
        run: cargo build --locked