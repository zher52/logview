name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS 是当前主要支持平台:.app 打包 + 文件类型关联
  # 同时出 Apple Silicon 与 Intel 两个产物(不做 universal:避免 lipo 合并与单包翻倍体积)
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 打包 .app
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/make_app.sh
      - name: 生成安装镜像 dmg
        env:
          ARCH: ${{ matrix.arch }}
        run: ./scripts/make_dmg.sh
      - name: 压缩 zip(备用)
        run: ditto -c -k --keepParent "target/日志查看器.app" "logview-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: logview-macos-${{ matrix.arch }}
          path: |
            logview-macos-${{ matrix.arch }}.dmg
            logview-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  # Windows / Linux 尚未充分验证,失败不阻塞 macOS 产物
  binary:
    name: ${{ matrix.name }} (实验性)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: logview-windows
            # 裸 exe 直接分发,zip 保留给需要打包传输的场景
            outputs: |
              logview.exe
              logview-windows.zip
          - os: ubuntu-latest
            name: logview-linux-bin
            # 裸二进制;带 .desktop 的便携包与 AppImage 由下面的 linux 任务产出
            outputs: logview-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev libdbus-1-dev
      - name: 构建
        run: cargo build --release --locked
      - name: 打包
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            # 裸 exe 放到根目录直接发布;zip 里只放 exe 本身,避免解压出 target/release/ 多层目录
            cp target/release/logview.exe logview.exe
            cd target/release && 7z a "../../logview-windows.zip" logview.exe
          else
            cp target/release/logview logview-linux-x86_64
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.outputs }}
          if-no-files-found: ignore

  # Linux:便携包(tar.gz)+ AppImage,内含 .desktop 与图标,可注册文件关联
  linux:
    name: Linux 便携包与 AppImage
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装构建与打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev libdbus-1-dev \
            desktop-file-utils
      - name: 校验桌面条目
        run: desktop-file-validate assets/linux/logview.desktop
      - name: 下载 appimagetool
        run: |
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
      - name: 打包
        env:
          APPIMAGETOOL: /tmp/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./scripts/make_linux.sh
      # 不要与 binary 矩阵的 Linux 产物同名:同名产物在下载合并时会互相覆盖,
      # 之前 AppImage 就是这样没进 Release 的
      - uses: actions/upload-artifact@v7
        with:
          name: logview-linux-pkg
          path: |
            target/logview-linux-*.tar.gz
            target/logview-*.AppImage
          if-no-files-found: error

  # Windows msi:每用户安装(装到 %LOCALAPPDATA%\LogViewer),含开始菜单快捷方式与「打开方式」注册
  windows-msi:
    name: Windows msi (实验性)
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 WiX Toolset
        run: choco install wixtoolset --no-progress -y
      - name: 生成 msi
        shell: pwsh
        run: ./scripts/make_msi.ps1
      - name: 冒烟测试 msi
        shell: pwsh
        run: ./scripts/test_msi.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: logview-windows-msi
          path: target/logview-*-x64.msi
          if-no-files-found: error

  publish:
    name: 发布 Release
    needs: [macos, binary, linux, windows-msi]
    # macOS 是阻塞产物;Windows/Linux 为实验性(continue-on-error),等待它们完成但失败不阻塞发布
    if: startsWith(github.ref, 'refs/tags/') && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 生成 SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 附加产物
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
          generate_release_notes: true