[package]
name = "logview"
version = "0.4.0"
edition = "2021"
rust-version = "1.92"
description = "日志查看器(GPUI 版):本地/SSH/HTTP 日志源,正则级别分析、检索过滤、自动追加、链接识别"
license = "AGPL-3.0-only"
repository = "https://github.com/zher52/logview"
readme = "README.md"
keywords = ["log", "viewer", "gpui", "tail", "ssh"]
categories = ["gui", "command-line-utilities"]

[dependencies]
gpui-kit = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "7"
open = "5"
anyhow = "1"
crossbeam-channel = "0.5"
ssh2 = "0.9"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ropey = "=2.0.0-beta.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# 行时间戳按本地时区格式化(仅需要 clock/std,不引入 oldtime)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
# 构建期解析 locales/*.toml 并生成查表
toml = "0.8"

[profile.dev]
opt-level = 1

# 依赖用优化级别编译,保证调试运行时 UI 流畅
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = false
