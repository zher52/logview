[package]
name = "logview"
version = "0.2.0"
edition = "2021"
description = "日志查看器(GPUI 版):本地/SSH/HTTP 日志源,正则级别分析、检索过滤、自动追加、链接识别"
license = "MIT"

[dependencies]
gpui-kit = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "5"
open = "5"
anyhow = "1"
crossbeam-channel = "0.5"
ssh2 = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ropey = "=2.0.0-beta.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# 行时间戳按本地时区格式化(仅需要 clock/std,不引入 oldtime)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.dev]
opt-level = 1

# 依赖用优化级别编译,保证调试运行时 UI 流畅
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = false
