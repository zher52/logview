[package]
name = "logview"
version = "0.4.1"
edition = "2021"
rust-version = "1.92"
description = "日志查看器(GPUI 版):本地/SSH/HTTP 日志源,正则级别分析、检索过滤、自动追加、链接识别"
license = "AGPL-3.0-only"
repository = "https://github.com/zher52/logview"
readme = "README.md"
keywords = ["log", "viewer", "gpui", "tail", "ssh"]
categories = ["gui", "command-line-utilities"]

[dependencies]
gpui-kit = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "7"
open = "5"
anyhow = "1"
crossbeam-channel = "0.5"
ssh2 = "0.9"
sha2 = "0.11"
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ropey = "=2.0.0-beta.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# 行时间戳按本地时区格式化(仅需要 clock/std,不引入 oldtime)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# ssh2 → libssh2 在 macOS 上默认链接系统/Homebrew 的 OpenSSL,产物会依赖
# /usr/local/opt/openssl@X 这类绝对路径(用户机器上没有就打不开);跨架构构建也找不到对应
# 架构的库。因此 macOS 与 Windows 都改用 vendored OpenSSL,静态链进二进制。
# Windows 另外需要 openssl-on-win32:WinCNG 后端没有 userauth_pubkey_memory(私钥文本认证)。
[target.'cfg(target_os = "macos")'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target.'cfg(windows)'.dependencies]
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }

[build-dependencies]
# 构建期解析 locales/*.toml 并生成查表
toml = "1.2"

[profile.dev]
opt-level = 1

# 依赖用优化级别编译,保证调试运行时 UI 流畅
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = false
