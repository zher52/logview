# cargo-deny 配置:依赖许可、来源与重复版本检查
# 用法:cargo deny check licenses bans sources
# (安全公告由 .github/workflows/audit.yml 的 rustsec/audit-check 负责)

[licenses]
# 本项目自身为 AGPL-3.0-only;其余为宽松许可或与之兼容的弱著佐权许可
allow = [
    "AGPL-3.0-only",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "NCSA",
    "BSL-1.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
# gpui / keyring 依赖树中不可避免存在多版本,先只提示
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []